name: rag-interview-agent

services:
  # ── FastAPI 后端 ──
  api:
    build: .
    image: rag-interview-agent:latest
    container_name: rag-api
    ports:
      - "8001:8001"
    environment:
      - MILVUS_DB_PATH=http://host.docker.internal:19530
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-openai_compatible}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-https://api.siliconflow.cn/v1}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-m3}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-1024}
      - EMBEDDING_BATCH_SIZE=${EMBEDDING_BATCH_SIZE:-16}
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ── Streamlit 前端 ──
  web:
    image: rag-interview-agent:latest
    container_name: rag-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8501:8501"
    environment:
      - API_BASE=http://api:8001
    command: >
      streamlit run src/web/streamlit_app.py
      --server.port 8501
      --server.address 0.0.0.0
      --server.headless true
    restart: unless-stopped